name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download Sypex Geo databases
        run: |
          mkdir -p testdata
          curl -fsSL -o /tmp/country.zip https://sypexgeo.net/files/SxGeoCountry.zip
          curl -fsSL -o /tmp/city.zip https://sypexgeo.net/files/SxGeoCity_utf8.zip
          unzip -o /tmp/country.zip -d testdata
          unzip -o /tmp/city.zip -d testdata
      - run: ./gradlew test

  publish:
    # a tag like 1.2.3 releases that version to Maven Central
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: ./gradlew publishAndReleaseToMavenCentral -Pversion=${{ github.ref_name }}
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
