name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Downloads the real databases at most once a month (per branch cache scope) and caches them for the test jobs.
  testdata:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=sypexgeo-testdata-$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@v4
        with:
          path: testdata
          key: ${{ steps.key.outputs.key }}
      - name: Download Sypex Geo databases
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # an outage of sypexgeo.net (or a non-zip answer) must not break CI: the integration tests are then skipped
          rm -rf testdata && mkdir -p testdata
          if curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/country.zip" https://sypexgeo.net/files/SxGeoCountry.zip &&
             curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/city.zip" https://sypexgeo.net/files/SxGeoCity_utf8.zip &&
             unzip -o "$RUNNER_TEMP/country.zip" -d testdata &&
             unzip -o "$RUNNER_TEMP/city.zip" -d testdata &&
             test -s testdata/SxGeo.dat && test -s testdata/SxGeoCity.dat; then
            :
          else
            rm -rf testdata # nothing is cached, the next run tries again
            echo "::warning::Could not download the Sypex Geo databases, the integration tests will be skipped"
          fi

  build:
    needs: testdata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Gradle runs on JDK 17+; with 8 and 11 only the tests run on that JDK (Gradle toolchain, see build.gradle.kts)
        java: [8, 11, 17, 21]
    name: build (JDK ${{ matrix.java }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java }} for the tests
        if: matrix.java < 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up JDK for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java < 17 && 17 || matrix.java }}
      - uses: gradle/actions/setup-gradle@v4 # caches Gradle files and validates the wrapper
      - uses: actions/cache/restore@v4
        with:
          path: testdata
          key: ${{ needs.testdata.outputs.key }}
      - name: Build (tests, Dokka javadoc jar, publication)
        run: >
          ./gradlew build publishToMavenLocal
          ${{ matrix.java < 17 && format('-PtestJavaVersion={0} -Porg.gradle.java.installations.fromEnv=JAVA_HOME_{0}_X64', matrix.java) || '' }}
